<!DOCTYPE html>
<html lang="en">
<head>
    <!--ข้อมูลเว็บไซต์-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="เครื่องคิดเลข">
    <meta name="keywords" content="CALRULATOR, เครื่องคิดเลข">
    <meta name="author" content="เพทาย สิทธิแพทย์">
    <title>PEITAYI CALRULATOR</title>
</head>
<style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0f0f0f;
      color: #eee;
    }

    .calculator {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 150, 0.3);
      width: 280px;
    }

    .calculator input {
      width: 100%;
      height: 60px;
      font-size: 1.5em;
      text-align: right;
      margin-bottom: 20px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #121212;
      color: #0f0;
      box-shadow: inset 0 0 8px rgba(0, 255, 150, 0.5);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 55px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      background: #2a2a2a;
      color: #eee;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 0 6px rgba(0, 255, 150, 0.2);
    }

    button:hover {
      background: #333;
      box-shadow: 0 0 12px rgba(0, 255, 150, 0.6);
      transform: scale(1.05);
    }

    .equal {
      grid-column: span 2;
      background: linear-gradient(135deg, #00ff99, #00cc88);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(0, 255, 150, 0.7);
    }

    .equal:hover {
      background: linear-gradient(135deg, #00ffaa, #00dd99);
      transform: scale(1.08);
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="append('/')">÷</button>
      <button onclick="append('*')">×</button>
      <button onclick="backspace()">⌫</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('-')">-</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('+')">+</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
    </div>
  </div>

  <script>
    let display = document.getElementById("display");

    function append(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = "";
    }

    function backspace() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch {
        display.value = "Error";
      }
    }
  </script>
</body>
</html>
